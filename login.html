<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agency - Admin Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            max-width: 450px;
            width: 100%;
            padding: 50px 40px;
            text-align: center;
        }
        .login-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-blue);
        }
        .login-icon i {
            font-size: 2rem;
            color: var(--white);
        }
        .login-card h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--dark-color);
            margin-bottom: 10px;
        }
        .login-card p {
            color: var(--gray);
            margin-bottom: 30px;
        }
        .login-form .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .login-form label {
            display: block;
            font-weight: 600;
            color: var(--dark-color);
            margin-bottom: 8px;
        }
        .login-form input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            transition: var(--transition);
            background: rgba(255, 255, 255, 0.8);
        }
        .login-form input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
            background: var(--white);
        }
        .login-btn {
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 10px;
        }
        .error-message {
            background: rgba(255, 59, 48, 0.1);
            color: #ff3b30;
            padding: 12px;
            border-radius: var(--radius-sm);
            margin-bottom: 20px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-color);
            font-weight: 500;
            margin-top: 20px;
            transition: var(--transition);
        }
        .back-link:hover {
            color: var(--secondary-color);
        }
        body.dark-mode .login-card {
            background: rgba(60, 60, 75, 0.95);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        body.dark-mode .login-card h1 {
            color: #ffffff;
        }
        body.dark-mode .login-card p {
            color: rgba(255, 255, 255, 0.8);
        }
        body.dark-mode .login-form label {
            color: #ffffff;
        }
        body.dark-mode .login-form input {
            background: rgba(45, 45, 55, 0.9);
            border-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }
        body.dark-mode .login-form input:focus {
            background: rgba(55, 55, 65, 1);
        }
    </style>
<style>
/* =========================================
   CINEMATIC GLASS DESIGN SYSTEM
   ========================================= */
body.cinematic-glass-theme {
    background-color: #050508 !important;
    background-image: 
        radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 40%) !important;
    background-attachment: fixed !important;
    color: #f8fafc !important;
}

.cinematic-glass-theme .card, 
.cinematic-glass-theme .panel, 
.cinematic-glass-theme .glass-panel, 
.cinematic-glass-theme .navbar, 
.cinematic-glass-theme .nav, 
.cinematic-glass-theme footer,
.cinematic-glass-theme .footer,
.cinematic-glass-theme .product-card,
.cinematic-glass-theme .service-card,
.cinematic-glass-theme .feature-card,
.cinematic-glass-theme .stat-card,
.cinematic-glass-theme .modal-content,
.cinematic-glass-theme .about-image {
    background: rgba(15, 15, 25, 0.55) !important;
    backdrop-filter: blur(16px) !important;
    -webkit-backdrop-filter: blur(16px) !important;
    border: 1px solid rgba(255, 255, 255, 0.08) !important;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3) !important;
    border-radius: 16px !important;
    color: #f1f5f9 !important;
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease !important;
}

.cinematic-glass-theme .card:hover, 
.cinematic-glass-theme .product-card:hover, 
.cinematic-glass-theme .service-card:hover, 
.cinematic-glass-theme .feature-card:hover {
    transform: translateY(-5px) !important;
    box-shadow: 0 15px 40px rgba(99, 102, 241, 0.25) !important;
    border-color: rgba(255, 255, 255, 0.2) !important;
}

.cinematic-glass-theme h1, 
.cinematic-glass-theme h2, 
.cinematic-glass-theme h3,
.cinematic-glass-theme h4,
.cinematic-glass-theme h5,
.cinematic-glass-theme h6 {
    color: #ffffff !important;
    letter-spacing: -0.02em !important;
}

.cinematic-glass-theme p, 
.cinematic-glass-theme span, 
.cinematic-glass-theme a,
.cinematic-glass-theme li {
    color: #cbd5e1 !important;
}

.cinematic-glass-theme button, 
.cinematic-glass-theme .btn,
.cinematic-glass-theme .btn-primary {
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.8), rgba(168, 85, 247, 0.8)) !important;
    border: 1px solid rgba(255, 255, 255, 0.2) !important;
    color: #fff !important;
    backdrop-filter: blur(8px) !important;
    border-radius: 8px !important;
    box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2) !important;
    transition: all 0.3s ease !important;
}

.cinematic-glass-theme button:hover, 
.cinematic-glass-theme .btn:hover {
    transform: translateY(-2px) !important;
    box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4) !important;
    border-color: rgba(255, 255, 255, 0.4) !important;
}

.cinematic-glass-theme input, 
.cinematic-glass-theme textarea, 
.cinematic-glass-theme select {
    background: rgba(0, 0, 0, 0.3) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    color: #fff !important;
    border-radius: 8px !important;
}
.cinematic-glass-theme input:focus, 
.cinematic-glass-theme textarea:focus {
    border-color: rgba(99, 102, 241, 0.5) !important;
    outline: none !important;
}
</style>
</head>
<body class="cinematic-glass-theme">
    <div class="login-container">
        <div class="login-card glass-card">
            <div class="login-icon">
                <i class="fas fa-shield-alt"></i>
            </div>
            <h1>Admin Login</h1>
            <p>Enter your password to access the admin panel</p>
            
            <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-circle"></i> Incorrect password. Please try again.
            </div>
            
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="password" placeholder="Enter admin password" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary login-btn">
                    <i class="fas fa-sign-in-alt"></i> Login to Admin Panel
                </button>
            </form>
            
            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Website
            </a>
        </div>
    </div>

    <script>
        // Default password (CHANGE THIS!)
        const ADMIN_PASSWORD = 'admin123';
        
        // Check if already logged in
        if (localStorage.getItem('adminLoggedIn') === 'true') {
            window.location.href = 'admin-panel.html';
        }
        
        // Handle login
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            
            if (password === ADMIN_PASSWORD) {
                // Set login session
                localStorage.setItem('adminLoggedIn', 'true');
                localStorage.setItem('adminLoginTime', Date.now().toString());
                
                // Redirect to admin panel
                window.location.href = 'admin-panel.html';
            } else {
                // Show error
                errorMessage.classList.add('show');
                document.getElementById('password').value = '';
                
                // Shake animation
                document.querySelector('.login-card').style.animation = 'shake 0.5s';
                setTimeout(() => {
                    document.querySelector('.login-card').style.animation = '';
                }, 500);
            }
        });
        
        // Add shake animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
                20%, 40%, 60%, 80% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
